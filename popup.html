<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meta.ai Assistant Popup</title>
  <link rel="stylesheet" href="src/dashboard/dashboard.css" />
  <style>
    body {
      width: 540px;
      max-height: 590px;
      overflow-y: auto;
    }
    .app-container {
      padding: 12px;
      gap: 12px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-left">
        <span class="logo-badge">META v3.7</span>
        <div class="header-title">
          <h1>Meta.ai Assistant</h1>
          <p>Quick Control Panel</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-open-full-dashboard" class="btn btn-primary btn-sm">Full Dashboard ↗</button>
      </div>
    </header>

    <!-- Quick Stats -->
    <div class="stats-bar">
      <div class="stat-card">
        <span class="stat-label">Tabs</span>
        <span class="stat-value" id="stat-total">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Ready</span>
        <span class="stat-value" style="color: var(--success);" id="stat-ready">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Running</span>
        <span class="stat-value" style="color: #60a5fa;" id="stat-running">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Completed</span>
        <span class="stat-value" style="color: var(--success);" id="stat-completed">0</span>
      </div>
    </div>

    <!-- Tab Duplicator -->
    <section class="section-card">
      <div class="section-header">
        <div class="section-title"><span>DUPLICATE ACTIVE CHAT</span></div>
      </div>
      <div class="section-body">
        <div class="form-group">
          <label>Initial Message (Carried into copies):</label>
          <input type="text" id="dup-initial-message" value="My Version of Title is:" placeholder="My Version of Title is:" />
        </div>
        <div class="form-row">
          <label>Copies:</label>
          <button class="btn btn-sm btn-dup-preset" data-count="1">1</button>
          <button class="btn btn-sm btn-dup-preset" data-count="5">5</button>
          <button class="btn btn-sm btn-dup-preset" data-count="10">10</button>
          <input type="number" id="dup-custom-count" placeholder="Custom" min="1" max="500" style="width: 65px;" />
          <button id="btn-duplicate-chats" class="btn btn-primary btn-sm">Duplicate</button>
        </div>
        <div class="form-row" id="popup-range-row" style="margin-top: 6px; gap: 6px; align-items: center; flex-wrap: wrap;">
          <span style="font-size: 11px; color: #94a3b8;">Video ID Range:</span>
          <span style="font-weight: bold; color: #38bdf8; font-size: 12px;">V</span>
          <input type="number" id="dup-range-start" min="1" max="1000" value="1" placeholder="1" style="width: 55px; padding: 2px 6px; font-size: 11px; background: #0f172a; color: #fff; border: 1px solid #475569; border-radius: 4px;" />
          <span style="font-size: 11px; color: #94a3b8;">to</span>
          <span style="font-weight: bold; color: #38bdf8; font-size: 12px;">V</span>
          <input type="number" id="dup-range-end" min="1" max="1000" value="5" placeholder="5" style="width: 55px; padding: 2px 6px; font-size: 11px; background: #0f172a; color: #fff; border: 1px solid #475569; border-radius: 4px;" />
          <span id="dup-range-preview" style="font-size: 11px; color: #60a5fa; font-weight: 600;">(V1–V5)</span>
        </div>
        <div style="margin-top: 6px; padding-top: 4px; border-top: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 4px;">
          <label style="display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: #38bdf8; cursor: pointer;">
            <input type="checkbox" id="chk-custom-video-ids" />
            <span>Custom Video IDs (Manual Fallback)</span>
          </label>
          <input type="text" id="input-custom-video-ids" placeholder="e.g. V3, V4, V7, V9, V10" style="padding: 3px 6px; font-size: 11px; background: #0f172a; color: #fff; border: 1px solid #475569; border-radius: 4px; display: none;" />
        </div>
      </div>
    </section>

    <!-- Execution Quick Controls -->
    <section class="section-card">
      <div class="section-header">
        <div class="section-title"><span>EXECUTION CONTROLS</span></div>
      </div>
      <div class="section-body">
        <div class="form-row">
          <button id="btn-run-all" class="btn btn-success btn-sm">RUN ALL</button>
          <button id="btn-pause-all" class="btn btn-warning btn-sm">PAUSE</button>
          <button id="btn-resume-all" class="btn btn-sm">RESUME</button>
          <button id="btn-download-all" class="btn btn-sm">DOWNLOAD ALL</button>
        </div>
      </div>
    </section>

    <!-- Video & Script Progress Tracker (Explicit Vx Py Markers) -->
    <section class="section-card" id="sec-popup-progress">
      <div class="section-header" style="display: flex; justify-content: space-between; align-items: center;">
        <div class="section-title"><span>VIDEO & SCRIPT PROGRESS (Vx Py)</span></div>
        <span id="popup-progress-badge" class="badge" style="background: rgba(59, 130, 246, 0.15); color: #60a5fa; font-size: 11px;">Active Tracker</span>
      </div>
      <div class="section-body">
        <div id="popup-videos-container" style="display: flex; flex-direction: column; gap: 8px;">
          <div style="color: var(--text-muted); font-size: 12px; text-align: center; padding: 12px;">Waiting for script generation...</div>
        </div>
      </div>
    </section>

    <!-- Recent Logs -->
    <section class="section-card">
      <div class="section-header">
        <div class="section-title"><span>RECENT ACTIVITY</span></div>
      </div>
      <div class="section-body">
        <div class="log-box" id="activity-log-container" style="max-height: 120px;"></div>
      </div>
    </section>
  </div>

  <script type="module" src="src/dashboard/popup.ts"></script>
</body>
</html>
