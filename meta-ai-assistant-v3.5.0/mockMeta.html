<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qwen Chat Mock Test Environment</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f141c;
      color: #e5e7eb;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }
    .mock-header {
      background: #18202f;
      padding: 12px 18px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 10px;
      background: #121824;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .message-bubble {
      padding: 12px 16px;
      border-radius: 8px;
      max-width: 80%;
      line-height: 1.5;
      font-size: 13px;
    }
    .user-message {
      background: #2563eb;
      align-self: flex-end;
      color: white;
    }
    .assistant-message {
      background: #1e293b;
      align-self: flex-start;
      border: 1px solid #334155;
    }
    .chat-input-container {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .attachment-preview-area {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .file-chip {
      background: #3b82f6;
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: #f8fafc;
      font-size: 13px;
      outline: none;
      resize: none;
      min-height: 44px;
    }
    .btn-action {
      background: #3b82f6;
      border: none;
      color: white;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-action:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    .generating-spinner {
      display: none;
      align-self: center;
      color: #f59e0b;
      font-size: 12px;
    }
  </style>
  <script type="module" crossorigin src="./assets/mockMeta-Pc6fbQgl.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="./assets/partDetector-CmRl1SmH.js">
  <link rel="stylesheet" crossorigin href="./assets/mockMeta-D8NiR8Pt.css">
</head>
<body>
  <div class="mock-header">
    <h2>Qwen Chat Test Harness (Local Simulation)</h2>
    <span style="font-size: 12px; color: #94a3b8;">Simulating chat.qwen.ai DOM structure</span>
  </div>

  <div class="chat-messages" id="chat-messages-container">
    <div class="message-bubble assistant-message">
      Hello! I am Qwen. How can I help you write video scripts today?
    </div>
  </div>

  <div class="generating-spinner" id="generating-indicator">
    ⚡ Qwen is generating response...
  </div>

  <div class="chat-input-container">
    <div class="attachment-preview-area" id="attachment-previews"></div>
    <div class="input-row">
      <button class="btn-action" id="upload-button" aria-label="Upload file" title="Attach file">📎</button>
      <input type="file" id="file-upload-input" style="display: none;" multiple />
      
      <textarea id="chat-input" placeholder="Ask Qwen a question or type a message..."></textarea>
      
      <button class="btn-action send-btn" id="send-button" aria-label="Send message">Send ➔</button>
    </div>
  </div>

</body>
</html>
